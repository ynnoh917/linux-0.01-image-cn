name: EasyTier + Cloudflared Named Tunnel SSH

on:
  workflow_dispatch:

jobs:
  remote-task:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass unzip curl

      - name: Get latest EasyTier version
        id: easytier_version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/EasyTier/EasyTier/releases/latest \
            | grep -oP '"tag_name": "\K(.*?)(?=")')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup EasyTier and join virtual network
        env:
          ET_VERSION: ${{ steps.easytier_version.outputs.VERSION }}
        run: |
          ZIP_NAME="easytier-linux-x86_64-${ET_VERSION}.zip"
          URL="https://github.com/EasyTier/EasyTier/releases/download/${ET_VERSION}/${ZIP_NAME}"
          if ! curl -fL -o /tmp/easytier.zip "https://ghfast.top/${URL}"; then
            curl -fL -o /tmp/easytier.zip "$URL"
          fi
          rm -rf /tmp/easytier && mkdir -p /tmp/easytier
          unzip -o /tmp/easytier.zip -d /tmp/easytier
          ET_CORE=$(find /tmp/easytier -name easytier-core -type f | head -1)
          chmod +x "$ET_CORE"

          sudo "$ET_CORE" -d \
            --network-name 666hd27-ok \
            --network-secret 0 \
            -p tcp://public.easytier.cn:11010 tcp://easytier-us.slarker.me:11010 \
            > /tmp/easytier.log 2>&1 &

          for i in $(seq 1 30); do
            ping -c 1 -W 2 10.126.126.1 > /dev/null 2>&1 && break
            sleep 2
          done

      - name: SSH to remote and start cloudflared Named Tunnel
        env:
          REMOTE_HOST: "10.126.126.1"
          REMOTE_USER: "ysy"
          REMOTE_PASS: "0"
          CF_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          sshpass -p "$REMOTE_PASS" ssh \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$REMOTE_USER@$REMOTE_HOST" \
            "CF_TOKEN='$CF_TOKEN' bash -s" << 'REMOTE_SCRIPT'
              set -e

              # ===== 以下全部在你的电脑上执行 =====

              # ---------- 1. 下载 cloudflared（如果尚未存在） ----------
              if [ ! -x /tmp/cloudflared ]; then
                echo ">>> [YOUR PC] Downloading cloudflared..."
                CF_URL="https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
                CF_OK=0
                for MIRROR in "https://ghfast.top/" "https://gh-proxy.com/" ""; do
                  echo ">>> Trying mirror: ${MIRROR:-direct}"
                  if curl -fL --connect-timeout 15 --max-time 300 \
                       -o /tmp/cloudflared "${MIRROR}${CF_URL}"; then
                    SIZE=$(stat -c%s /tmp/cloudflared 2>/dev/null || echo 0)
                    if [ "$SIZE" -gt 10000000 ]; then
                      echo ">>> OK: cloudflared ($SIZE bytes)"
                      CF_OK=1; break
                    fi
                  fi
                done
                [ "$CF_OK" -eq 1 ] || { echo ">>> cloudflared download failed"; exit 1; }
                chmod +x /tmp/cloudflared
              fi

              # ---------- 2. 用 Token 启动 Named Tunnel（指向本机 SSH） ----------
              echo ">>> [YOUR PC] Starting Named Tunnel with token..."
              pkill -f "cloudflared tunnel run" 2>/dev/null || true
              nohup /tmp/cloudflared tunnel run --token "$CF_TOKEN" \
                > /tmp/cloudflared.log 2>&1 < /dev/null &

              # 轮询确认隧道进程已启动
              sleep 5
              if pgrep -f "cloudflared tunnel run" > /dev/null; then
                echo "================================================"
                echo ">>> [YOUR PC] Named Tunnel is RUNNING."
                echo ">>> 现在可以在任何地方用标准 SSH 连接你的电脑："
                echo ">>>   ssh ysy@ssh.你的域名.com"
                echo ">>>   （密码：0）"
                echo "================================================"
              else
                echo ">>> [YOUR PC] Tunnel process NOT found. Log tail:"
                tail -20 /tmp/cloudflared.log
              fi

              # ---------- 3. 1000 次爬虫测试（按你的要求保留） ----------
              echo ">>> [YOUR PC] Running 1000 crawler tests..."
              for i in $(seq 1 1000); do
                curl -s -o /dev/null -w "Request #$i: HTTP %{http_code}, time %{time_total}s\n" \
                  https://httpbin.org/delay/1 || true
                sleep 13
              done
              echo ">>> [YOUR PC] Done."
            REMOTE_SCRIPT