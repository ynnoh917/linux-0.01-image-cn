name: EasyTier SSH via Virtual IP

on:
  workflow_dispatch:

jobs:
  remote-task:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass unzip curl

      - name: Get latest EasyTier version
        id: easytier_version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/EasyTier/EasyTier/releases/latest \
            | grep -oP '"tag_name": "\K(.*?)(?=")')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo ">>> Latest EasyTier version: $VERSION"

      - name: Setup EasyTier and join virtual network
        env:
          ET_VERSION: ${{ steps.easytier_version.outputs.VERSION }}
        run: |
          echo ">>> Downloading EasyTier $ET_VERSION ..."
          ZIP_NAME="easytier-linux-x86_64-${ET_VERSION}.zip"
          URL="https://github.com/EasyTier/EasyTier/releases/download/${ET_VERSION}/${ZIP_NAME}"
          if ! curl -fL -o /tmp/easytier.zip "https://ghfast.top/${URL}"; then
            curl -fL -o /tmp/easytier.zip "$URL"
          fi
          rm -rf /tmp/easytier && mkdir -p /tmp/easytier
          unzip -o /tmp/easytier.zip -d /tmp/easytier
          ET_CORE=$(find /tmp/easytier -name easytier-core -type f | head -1)
          ET_CLI=$(find /tmp/easytier -name easytier-cli -type f | head -1)
          chmod +x "$ET_CORE" "$ET_CLI"

          echo ">>> Starting EasyTier (DHCP mode, network: 666hd27-ok)..."
          sudo "$ET_CORE" -d \
            --network-name 666hd27-ok \
            --network-secret 0 \
            -p tcp://public.easytier.cn:11010 tcp://easytier-us.slarker.me:11010 \
            > /tmp/easytier.log 2>&1 &
          
          echo ">>> Waiting for EasyTier to establish connection..."
          for i in $(seq 1 30); do
            if ping -c 1 -W 2 10.126.126.1 > /dev/null 2>&1; then
              echo ">>> EasyTier is up, 10.126.126.1 is reachable."
              break
            fi
            sleep 2
          done
          tail -30 /tmp/easytier.log || true

      - name: SSH to remote (10.126.126.1) and run tasks
        env:
          REMOTE_HOST: "10.126.126.1"
          REMOTE_USER: "ysy"
          REMOTE_PASS: "0"
        run: |
          sshpass -p "$REMOTE_PASS" ssh \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$REMOTE_USER@$REMOTE_HOST" '
              set -e

              # ===== 以下命令在你的电脑（国内）上执行 =====
              echo ">>> [YOUR PC] Downloading cloudflared with CN mirrors..."

              CF_URL="https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
              CF_OK=0
              for MIRROR in "https://ghfast.top/" "https://gh-proxy.com/" "https://mirror.ghproxy.com/" ""; do
                echo ">>> Trying mirror: ${MIRROR:-direct}"
                if curl -fL --connect-timeout 15 --max-time 300 \
                     -o /tmp/cloudflared "${MIRROR}${CF_URL}"; then
                  SIZE=$(stat -c%s /tmp/cloudflared 2>/dev/null || echo 0)
                  if [ "$SIZE" -gt 10000000 ]; then
                    echo ">>> OK: downloaded cloudflared ($SIZE bytes)"
                    CF_OK=1
                    break
                  else
                    echo ">>> Bad file size ($SIZE), trying next mirror..."
                  fi
                fi
              done

              if [ "$CF_OK" -ne 1 ]; then
                echo ">>> ERROR: failed to download cloudflared from all mirrors"
                exit 1
              fi

              chmod +x /tmp/cloudflared

              echo ">>> [YOUR PC] Starting Quick Tunnel to tcp://localhost:22 ..."
              nohup /tmp/cloudflared tunnel --url tcp://localhost:22 \
                > /tmp/cloudflared.log 2>&1 < /dev/null &
              sleep 6

              echo ">>> [YOUR PC] Cloudflared tunnel URL:"
              grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" /tmp/cloudflared.log | head -1 || true

              echo ">>> [YOUR PC] Running 1000 crawler tests..."
              for i in $(seq 1 1000); do
                curl -s -o /dev/null -w "Request #$i: HTTP %{http_code}, time %{time_total}s\n" \
                  https://httpbin.org/delay/1 || true
                sleep 13
              done
              echo ">>> [YOUR PC] 1000 crawler tests finished."
            '